defaults:
  - model_vqvae_transformer_split
  - _self_

# Half-length direct-prefix run with the original 8192-alpha/skewed-mu split FSQ.
model_kwargs:
  causal_decoder: false
  latent_sequence_compression:
    enabled: true
    ratio: 0.5
    min_tokens: 1
    rounding: ceil
    mode: direct_prefix_masking
  split_quantizer_cfg:
    branch_order: ["mu", "alpha"]
    branch_loss_weights:
      mu: 0.25
      alpha: 1.0
    fsq_mu_levels: [5, 4, 4, 3, 3, 3, 2, 2]
    fsq_alpha_levels: [8192]
